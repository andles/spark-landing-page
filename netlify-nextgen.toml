# NextGen theme — deployed to sparkinventory.ai
# Use this config when creating the NextGen Netlify site:
# netlify deploy --config netlify-nextgen.toml

[build]
  command = "npm run build:nextgen"
  publish = "dist-nextgen"

[build.environment]
  VITE_THEME = "nextgen"

# Consolidate the legacy ampersand URL into the clean canonical URL.
[[redirects]]
  from = "/reduce-stockouts-&-overstock"
  to = "/reduce-stockouts-overstock/"
  status = 301
  force = true

# Only the two genuinely client-only route families use the SPA shell.
# Every public marketing route is a prerendered file; unknown paths therefore
# fall through to Netlify's generated 404.html with a real 404 status.
[[redirects]]
  from = "/r/*"
  to = "/spa-shell.html"
  status = 200

[[redirects]]
  from = "/book-a-call"
  to = "/spa-shell.html"
  status = 200

# Hashed build assets never change — cache forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Unlisted prospect reports: keep out of search indexes at the HTTP level
# (more robust than the client-side-injected noindex meta)
[[headers]]
  for = "/r/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/meeting-confirmed/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/meeting-confirmed"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/book-a-call"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/spa-shell.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
