<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Select the Fishbowl campaign hero before first paint. The clean URL
         remains the indexable default; any explicit utm_content uses the
         paid-campaign message while keeping the same canonical page. -->
    <script>
      (function () {
        var hasCampaignContent = new URLSearchParams(window.location.search).has('utm_content');
        document.documentElement.dataset.fishbowlVariant = hasCampaignContent ? 'campaign' : 'organic';
      })();
    </script>
    <style>
      [data-fishbowl-variant-copy] { display: none; }
      html:not([data-fishbowl-variant]) [data-fishbowl-variant-copy="organic"],
      html[data-fishbowl-variant="organic"] [data-fishbowl-variant-copy="organic"],
      html[data-fishbowl-variant="campaign"] [data-fishbowl-variant-copy="campaign"] { display: block; }
    </style>
    <!-- Google Consent Mode v2 default state. MUST run before CookieYes and
         any Google tag. All non-essential storage is denied until the
         consent-gated tags script below reads CookieYes and calls
         gtag('consent','update',...). Do not move below the tags below. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'analytics_storage': 'denied',
        'functionality_storage': 'denied',
        'personalization_storage': 'denied',
        'security_storage': 'granted',
        'wait_for_update': 500
      });
    </script>
    <!-- Start cookieyes banner -->
    <link rel="preconnect" href="https://cdn-cookieyes.com" crossorigin>
    <script id="cookieyes" type="text/javascript" async src="https://cdn-cookieyes.com/client_data/ef5cba13a3fdf3dd6aa6cb2ff6a16792/script.js"></script>
    <!-- End cookieyes banner -->
    <!-- Consent-gated tags: PHAS3 attribution, the LinkedIn Insight Tag and the
         Google Consent Mode update. CookieYes picks the banner law per visitor
         (gdpr opt-in for the EU and UK, ccpa notice for the US), and its
         categories carry the choice under either law. Nothing loads until a
         banner has loaded, so a region without a banner stays opted out, and
         Global Privacy Control blocks every advertising and third-party
         attribution tag whatever the categories say. Keep CookieYes's own
         Google Consent Mode setting off: this script is the only writer.
         The noscript LinkedIn pixel is omitted because it cannot be gated.
         Keep aligned with web-app/index.html in the monorepo; covered by
         src/consentGatedTags.test.ts. -->
    <script id="consent-gated-tags">
      (function () {
        var phas3Loaded = false;
        var linkedInLoaded = false;
        var appliedGoogleConsent = "";

        function loadPhas3() {
          if (phas3Loaded) return;
          phas3Loaded = true;
          var script = document.createElement("script");
          script.async = true;
          script.src = "https://www.phas3.ai/api/tracking?id=049ae405-308e-4c3c-8b2d-9d10b5e16f9c";
          document.head.appendChild(script);
        }

        function loadLinkedInInsightTag() {
          if (linkedInLoaded) return;
          linkedInLoaded = true;

          window._linkedin_partner_id = "9629434";
          window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || [];
          window._linkedin_data_partner_ids.push(window._linkedin_partner_id);

          if (!window.lintrk) {
            window.lintrk = function (firstArgument, secondArgument) {
              window.lintrk.q.push([firstArgument, secondArgument]);
            };
            window.lintrk.q = [];
          }

          var insightScript = document.createElement("script");
          insightScript.type = "text/javascript";
          insightScript.async = true;
          insightScript.src = "https://snap.licdn.com/li.lms-analytics/insight.min.js";
          document.head.appendChild(insightScript);
        }

        function applyConsent() {
          var consent = typeof window.getCkyConsent === "function" ? window.getCkyConsent() : null;
          if (!consent || !consent.activeLaw || !consent.categories) return;
          var gpc = navigator.globalPrivacyControl === true;
          var analytics = consent.categories.analytics === true;
          var advertising = !gpc && consent.categories.advertisement === true;
          var ads = advertising ? "granted" : "denied";
          var googleConsent = ads + (analytics ? ",granted" : ",denied");
          if (googleConsent !== appliedGoogleConsent) {
            appliedGoogleConsent = googleConsent;
            gtag("consent", "update", {
              ad_storage: ads,
              ad_user_data: ads,
              ad_personalization: ads,
              analytics_storage: analytics ? "granted" : "denied"
            });
          }
          if (analytics && !gpc) loadPhas3();
          if (advertising) loadLinkedInInsightTag();
        }

        document.addEventListener("cookieyes_banner_load", applyConsent);
        document.addEventListener("cookieyes_consent_update", applyConsent);
      })();
    </script>
    <link rel="icon" type="image/png" href="/spark-favicon.png" />
    <link rel="canonical" href="https://sparkinventory.com/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Forecast demand, reduce stockouts, and turn live inventory data into draft purchase orders. Spark connects purchasing, sales, warehousing, and accounting." />
    <!-- Google tag (gtag.js). Queue consent and conversion calls immediately,
         but keep the 187 KiB tag off the critical rendering path. It loads on
         first intent or shortly after the page is fully loaded. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('set', 'linker', {
        'domains': ['sparkinventory.com', 'app.sparkinventory.com']
      });
      gtag('config', 'AW-17962279599', {
        'allow_enhanced_conversions': true
      });

      (function () {
        // Global Privacy Control opts the browser out of advertising, so the
        // tag never loads for it. Otherwise CookieYes holds the script back
        // until its category is allowed.
        if (navigator.globalPrivacyControl === true) return;
        var loaded = false;
        var fallbackTimer;
        function loadGoogleTag() {
          if (loaded) return;
          loaded = true;
          if (fallbackTimer) window.clearTimeout(fallbackTimer);
          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=AW-17962279599';
          document.head.appendChild(script);
        }
        window.addEventListener('pointerdown', loadGoogleTag, { once: true, passive: true });
        window.addEventListener('keydown', loadGoogleTag, { once: true });
        window.addEventListener('load', function () {
          fallbackTimer = window.setTimeout(loadGoogleTag, 5000);
        }, { once: true });
      })();
    </script>
    <!-- Inter is self-hosted (see src/index.css) and deliberately not
         preloaded: Chrome holds the first paint until a preloaded font
         arrives, and in Lighthouse's mobile runs that wait pushed the paint
         back a full second. Headings paint in a size-matched fallback until
         Inter loads. -->
    <title>AI Inventory Management &amp; Demand Forecasting | Spark</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
