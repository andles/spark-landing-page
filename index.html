<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google Consent Mode v2 default state. MUST run before CookieYes and
         any Google tag. Opt-in posture: all non-essential storage denied until
         the visitor consents via the CookieYes banner (which then calls
         gtag('consent','update',...)). Do not move below the tags below. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'analytics_storage': 'denied',
        'functionality_storage': 'denied',
        'personalization_storage': 'denied',
        'security_storage': 'granted',
        'wait_for_update': 500
      });
    </script>
    <!-- Start cookieyes banner -->
    <link rel="preconnect" href="https://cdn-cookieyes.com" crossorigin>
    <script id="cookieyes" type="text/javascript" async src="https://cdn-cookieyes.com/client_data/ef5cba13a3fdf3dd6aa6cb2ff6a16792/script.js"></script>
    <!-- End cookieyes banner -->
    <link rel="icon" type="image/webp" href="/spark-icon-64.webp" />
    <link rel="canonical" href="https://sparkinventory.com/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Forecast demand, reduce stockouts, and turn live inventory data into draft purchase orders. Spark connects purchasing, sales, warehousing, manufacturing, and accounting." />
    <!-- Google tag (gtag.js). Queue consent and conversion calls immediately,
         but keep the 187 KiB tag off the critical rendering path. It loads on
         first intent or shortly after the page is fully loaded. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('set', 'linker', {
        'domains': ['sparkinventory.com', 'app.sparkinventory.com']
      });
      gtag('config', 'AW-17962279599', {
        'allow_enhanced_conversions': true
      });

      (function () {
        var loaded = false;
        var fallbackTimer;
        function loadGoogleTag() {
          if (loaded) return;
          loaded = true;
          if (fallbackTimer) window.clearTimeout(fallbackTimer);
          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=AW-17962279599';
          document.head.appendChild(script);
        }
        window.addEventListener('pointerdown', loadGoogleTag, { once: true, passive: true });
        window.addEventListener('keydown', loadGoogleTag, { once: true });
        window.addEventListener('load', function () {
          fallbackTimer = window.setTimeout(loadGoogleTag, 5000);
        }, { once: true });
      })();
    </script>
    <!-- Inter is self-hosted (see src/index.css); preload the latin subset
         used by virtually all text so the first paint uses the real font -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
    <title>AI Inventory Management &amp; Demand Forecasting | Spark</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
