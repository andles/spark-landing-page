# Both domains now use the nextgen theme
[build]
  command = "npm run build:nextgen"
  publish = "dist-nextgen"

# Retired marketing media resolves to the approved versions, including existing files.
[[redirects]]
  from = "/hero-video.mp4"
  to = "/media/hero-original-final.mp4"
  status = 301
  force = true

[[redirects]]
  from = "/hero-video.webm"
  to = "/media/hero-original-final.webm"
  status = 301
  force = true

[[redirects]]
  from = "/spark-demo.mp4"
  to = "/media/hero-original-final.mp4"
  status = 301
  force = true

[[redirects]]
  from = "/hero-video-poster-mobile.webp"
  to = "/media/hero-original-final-poster.webp"
  status = 301
  force = true

[[redirects]]
  from = "/hero-video-poster.jpg"
  to = "/media/hero-original-final-poster.webp"
  status = 301
  force = true

[[redirects]]
  from = "/media/fishbowl-final-v4.mp4"
  to = "/media/fishbowl-demand-esp-v5.mp4"
  status = 301
  force = true

[[redirects]]
  from = "/media/fishbowl-final-v4-poster.jpg"
  to = "/media/fishbowl-demand-esp-v5-poster.jpg"
  status = 301
  force = true

[[redirects]]
  from = "/media/fishbowl-final-v4-captions.vtt"
  to = "/media/fishbowl-demand-esp-v5-captions.vtt"
  status = 301
  force = true

[[redirects]]
  from = "/media/fishbowl-bridge.mp4"
  to = "/media/fishbowl-demand-esp-v5.mp4"
  status = 301
  force = true

[[redirects]]
  from = "/media/fishbowl-bridge-poster.jpg"
  to = "/media/fishbowl-demand-esp-v5-poster.jpg"
  status = 301
  force = true

[[redirects]]
  from = "/media/fishbowl-bridge-captions.vtt"
  to = "/media/fishbowl-demand-esp-v5-captions.vtt"
  status = 301
  force = true

[[redirects]]
  from = "/media/fishbowl-bridge-v3.mp4"
  to = "/media/fishbowl-demand-esp-v5.mp4"
  status = 301
  force = true

[[redirects]]
  from = "/media/fishbowl-bridge-v3-poster.jpg"
  to = "/media/fishbowl-demand-esp-v5-poster.jpg"
  status = 301
  force = true

[[redirects]]
  from = "/media/fishbowl-bridge-v3-captions.vtt"
  to = "/media/fishbowl-demand-esp-v5-captions.vtt"
  status = 301
  force = true

# Consolidate the legacy ampersand URL into the clean canonical URL.
[[redirects]]
  from = "/reduce-stockouts-&-overstock"
  to = "/reduce-stockouts-overstock/"
  status = 301
  force = true

# Preserve links from the earlier forecasting campaign while consolidating
# authority on the current stockout and overstock landing page.
[[redirects]]
  from = "/forecasting"
  to = "/reduce-stockouts-overstock/"
  status = 301
  force = true

# Preserve the short URL used in Fishbowl ads and outbound messages.
[[redirects]]
  from = "/fishbowl"
  to = "/fishbowl-alternative/"
  status = 301
  force = true

# Only the two genuinely client-only route families use the SPA shell.
# Every public marketing route is a prerendered file; unknown paths therefore
# fall through to Netlify's generated 404.html with a real 404 status.
[[redirects]]
  from = "/r/*"
  to = "/spa-shell.html"
  status = 200

[[redirects]]
  from = "/book-a-call"
  to = "/spa-shell.html"
  status = 200

# Hashed build assets never change, so cache forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Large static media is versioned with deployments and should be reused on
# repeat visits instead of revalidated on every page load.
[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Unlisted prospect reports: keep out of search indexes at the HTTP level
# (more robust than the client-side-injected noindex meta)
[[headers]]
  for = "/r/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/meeting-confirmed/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/meeting-confirmed"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/book-a-call"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/spa-shell.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
